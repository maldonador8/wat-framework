name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Syntax check all tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check tools/*.py
        run: |
          for f in tools/*.py; do
            echo "checking $f"
            python -c "import ast; ast.parse(open('$f').read())"
          done
